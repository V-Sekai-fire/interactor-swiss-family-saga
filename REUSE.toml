version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 K. S. Ernest (iFire) Lee"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The Chibifire design system (contract-design-chibifire, MIT), vendored from commit f4aca6b4a814de6908b600fb54a2e0e61af46370.
[[annotations]]
path = ["look/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 K. S. Ernest (iFire) Lee"
SPDX-License-Identifier = "MIT"

# The design system's fonts, with their own licences (the OFL texts beside them).
[[annotations]]
path = ["fonts/CormorantGaramond[wght].ttf", "fonts/OFL-Cormorant-Garamond.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2015 the Cormorant Project Authors (github.com/CatharsisFonts/Cormorant)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["fonts/IBMPlexMono-Medium.ttf", "fonts/IBMPlexMono-Regular.ttf", "fonts/IBMPlexSans.ttf", "fonts/OFL-IBM-Plex.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["fonts/Marcellus-Regular.ttf", "fonts/OFL-Marcellus.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2012 Brian J. Bonislawsky DBA Astigmatic (AOETI)"
SPDX-License-Identifier = "OFL-1.1"

# Fixtures made by the Party Saga model for the checker's gate.
[[annotations]]
path = ["conformance/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 K. S. Ernest (iFire) Lee"
SPDX-License-Identifier = "Apache-2.0 OR MIT"
